name: Build Home Mail images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant metadata
        uses: frenck/action-addon-linter@v2
        with:
          path: ./mail
      - name: Test Python cache and message parsing
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s mail/tests -v
      - name: Check JavaScript
        run: node --check mail/app/app.js

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ./mail
          file: ./mail/Dockerfile
          image: ghcr.io/braindelook/ha-mail-client-${{ matrix.arch }}
          image-tags: |
            0.3.4
            latest
          version: 0.3.4
          push: "true"
          cosign: "false"
          cache-gha: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=python:3.13-alpine
      - name: Smoke test HTTP and Ingress assets
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/braindelook/ha-mail-client-${{ matrix.arch }}:0.3.4"
          data="$(mktemp -d)"
          trap 'docker logs home-mail-smoke 2>/dev/null || true; docker rm -f home-mail-smoke 2>/dev/null || true; rm -rf "$data"' EXIT
          printf '%s\n' '{"gmail_email":"","gmail_app_password":"","sync_interval_minutes":5,"cache_per_folder":50}' > "$data/options.json"
          docker run -d --name home-mail-smoke -v "$data:/data" -p 127.0.0.1:18099:8099 "$image"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/status > "$data/status.json"; then break; fi
            sleep 1
          done
          grep -Fq '"configured":false' "$data/status.json"
          curl -fsS http://127.0.0.1:18099/ | grep -Fq 'Home Mail'
          curl -fsS http://127.0.0.1:18099/app.js | grep -Fq 'home-assistant/subscribe-properties'
          curl -fsS http://127.0.0.1:18099/api/folders | grep -Fq '"folders":[]'
          docker exec home-mail-smoke python -m compileall -q /opt/home-mail
      - name: Verify anonymous GHCR manifest
        shell: bash
        run: |
          set -euo pipefail
          image="braindelook/ha-mail-client-${{ matrix.arch }}"
          status=""
          for attempt in $(seq 1 12); do
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:${image}:pull&service=ghcr.io" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            status="$(curl -sS -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${image}/manifests/0.3.4")"
            if [ "$status" = 200 ]; then break; fi
            sleep 5
          done
          echo "Anonymous GHCR manifest status: $status"
          test "$status" = 200
